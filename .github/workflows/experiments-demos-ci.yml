name: Experiments Demos CI

run-name: Test experiment demos against llama-stack/llama-stack main branch

on:
  # Run on pushes to demo scripts
  push:
    branches:
      - main
    paths:
      - '*.py'
      - 'ollama-setup/**'
      - '.github/workflows/experiments-demos-ci.yml'
      - '.demos-ci-config.yml'

  # Run on PRs that modify demos
  pull_request:
    branches:
      - main
    paths:
      - '*.py'
      - 'ollama-setup/**'
      - '.github/workflows/experiments-demos-ci.yml'
      - '.demos-ci-config.yml'
  
  # Run daily to catch breakages from llama-stack changes
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC
  
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      demo-pattern:
        description: 'Pattern to match demo files (e.g., "0-*" or "2-rag.py")'
        required: false
        default: '*-*.py'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-demos:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']
        # We'll discover demos dynamically in the job
    
    steps:
      - name: Checkout experiments repository
        uses: actions/checkout@v4

      - name: Checkout llama-stack main
        uses: actions/checkout@v4
        with:
          repository: meta-llama/llama-stack
          ref: main
          path: llama-stack

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          version: 0.7.6

      - name: Install llama-stack from main
        run: |
          echo "Installing llama-stack from upstream main branch"
          cd llama-stack
          uv sync --all-groups
          uv pip install faiss-cpu

          echo "Installed llama-stack version:"
          uv run llama --version || uv run llama stack --version || echo "Version command not available"

          echo "Available in path:"
          which llama || echo "llama not in PATH"

      - name: Verify llama-stack installation
        run: |
          cd llama-stack
          source .venv/bin/activate

          echo "Testing llama-stack CLI:"
          llama stack list-apis || python -m llama_stack.cli.stack list-apis

          echo "Python packages:"
          uv pip list | grep llama
      
      - name: Setup Ollama
        run: |
          echo "Installing Ollama"
          curl -fsSL https://ollama.com/install.sh | sh
          
          echo "Starting Ollama service"
          ollama serve &
          
          echo "Waiting for Ollama to be ready"
          for i in {1..30}; do
            if curl -s http://localhost:11434/api/tags >/dev/null 2>&1; then
              echo "✅ Ollama is ready"
              break
            fi
            if [[ $i -eq 30 ]]; then
              echo "❌ Ollama failed to start"
              exit 1
            fi
            sleep 1
          done
          
          echo "Pulling required models"
          ollama pull llama3.2:3b-instruct-fp16
          ollama pull all-minilm:latest
      
      - name: Start Llama Stack Server
        run: |
          echo "Starting Llama Stack server from llama-stack main"
          cd llama-stack
          source .venv/bin/activate

          export OLLAMA_URL="http://localhost:11434"
          export LLAMA_STACK_PORT=8321

          # Use the config from experiments repo (parent directory)
          nohup llama stack run ../ollama-setup/ollama-stack-run.yaml --port 8321 > ../llama-stack.log 2>&1 &

          echo "Waiting for Llama Stack to be ready"
          for i in {1..60}; do
            if curl -s http://localhost:8321/health >/dev/null 2>&1; then
              echo "✅ Llama Stack is ready"
              break
            fi
            if [[ $i -eq 60 ]]; then
              echo "❌ Llama Stack failed to start"
              echo "=== Llama Stack logs ==="
              cat ../llama-stack.log
              exit 1
            fi
            sleep 2
          done

          cd ..
      
      - name: Discover and test demos
        id: test-demos
        run: |
          # Activate llama-stack venv (has llama-stack from main installed)
          cd llama-stack
          source .venv/bin/activate
          cd ..

          export OLLAMA_URL="http://localhost:11434"
          export LLAMA_STACK_PORT=8321
          export LLAMA_STACK_URL="http://localhost:8321"

          echo "=== Environment Info ==="
          echo "llama-stack version:"
          llama --version || llama stack --version || echo "Version not available"
          echo ""
          echo "Python packages:"
          pip list | grep llama
          echo ""

          # Read config if it exists
          CONFIG_FILE=".demos-ci-config.yml"
          if [ -f "$CONFIG_FILE" ]; then
            echo "Using config from $CONFIG_FILE"
          fi

          # Determine which demos to test
          DEMO_PATTERN="${{ github.event.inputs.demo-pattern || '*-*.py' }}"
          echo "Looking for demos matching: $DEMO_PATTERN"

          # We're already in the experiments repo root
          DEMOS=$(ls $DEMO_PATTERN 2>/dev/null || true)
          
          if [ -z "$DEMOS" ]; then
            echo "No demos found matching pattern: $DEMO_PATTERN"
            exit 0
          fi
          
          echo "Found demos:"
          echo "$DEMOS"
          echo ""
          
          # Run each demo
          FAILED_DEMOS=""
          PASSED_DEMOS=""
          SKIPPED_DEMOS=""
          
          for demo in $DEMOS; do
            # Check if demo should be skipped (based on config or naming)
            if [[ "$demo" == *"manual"* ]] || [[ "$demo" == *"skip"* ]]; then
              echo "⏭️  Skipping $demo (marked as manual/skip)"
              SKIPPED_DEMOS="$SKIPPED_DEMOS\n  - $demo"
              continue
            fi
            
            echo "========================================="
            echo "Testing: $demo"
            echo "========================================="
            
            # Run with timeout
            if timeout 120 python "$demo"; then
              echo "✅ PASSED: $demo"
              PASSED_DEMOS="$PASSED_DEMOS\n  - $demo"
            else
              EXIT_CODE=$?
              if [ $EXIT_CODE -eq 124 ]; then
                echo "❌ TIMEOUT: $demo (exceeded 120 seconds)"
              else
                echo "❌ FAILED: $demo (exit code: $EXIT_CODE)"
              fi
              FAILED_DEMOS="$FAILED_DEMOS\n  - $demo"
            fi
            echo ""
          done
          
          # Print summary
          echo "========================================="
          echo "SUMMARY"
          echo "========================================="
          echo -e "Passed:$PASSED_DEMOS"
          echo -e "Failed:$FAILED_DEMOS"
          echo -e "Skipped:$SKIPPED_DEMOS"
          
          # Fail if any demos failed
          if [ -n "$FAILED_DEMOS" ]; then
            echo ""
            echo "❌ Some demos failed"
            exit 1
          fi
          
          echo ""
          echo "✅ All demos passed"
      
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: demo-test-logs-${{ github.run_id }}
          path: |
            llama-stack.log
            experiments/*.log
          retention-days: 7
      
      - name: Show Llama Stack logs on failure
        if: failure()
        run: |
          echo "=== Llama Stack Server Logs ==="
          cat llama-stack.log || echo "No logs found"
          
          echo ""
          echo "=== Ollama Status ==="
          curl -s http://localhost:11434/api/tags || echo "Ollama not responding"

